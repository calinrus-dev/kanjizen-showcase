<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title"><title id="title">Lámina conceptual de KanjiZen: MECA, Flick, Colección, Perfil local. Elegir una fila → Practicar con guía → Responder sin ayuda → Revisar el progreso.</title><rect width="1600" height="960" fill="#0C1317"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C292F" stroke-width="0.6"/></pattern></defs><rect width="1600" height="960" fill="url(#grid)"/><text x="64" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="33" fill="#EDF0E9" font-weight="600">KanjiZen / MAPA DE EXPERIENCIA</text><text x="64" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A1F07A" font-weight="600">LÁMINA CONCEPTUAL · DATOS FICTICIOS · NO ES UNA CAPTURA DEL PRODUCTO</text><rect x="64" y="169" width="905" height="491" rx="12" fill="#10191E" stroke="#304047"/><rect x="84" y="189" width="865" height="38" rx="7" fill="#1C282F" stroke="#304047"/><text x="105" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#CCD5D7" font-weight="600">KANJIZEN / ESTUDIO VISUAL</text><text x="99" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#A1F07A" font-weight="600">LEER  →  RECORDAR  →  REPRODUCIR</text><rect x="99" y="310" width="154" height="141" rx="10" fill="#19282D" stroke="#304047"/><text x="142" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="77" fill="#F0F2ED" font-weight="400">あ</text><rect x="269" y="310" width="154" height="141" rx="10" fill="#19282D" stroke="#304047"/><text x="312" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="77" fill="#F0F2ED" font-weight="400">い</text><rect x="439" y="310" width="154" height="141" rx="10" fill="#19282D" stroke="#304047"/><text x="482" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="77" fill="#F0F2ED" font-weight="400">う</text><rect x="609" y="310"